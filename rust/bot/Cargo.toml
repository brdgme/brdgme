[package]
name = "bot"
version.workspace = true
edition.workspace = true
publish.workspace = true
authors.workspace = true

[[bin]]
name = "bot"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal"] }
serde.workspace = true
serde_json.workspace = true
reqwest = { workspace = true, features = ["json", "rustls"] }
sqlx = { workspace = true, features = ["time", "json"] }
uuid = { workspace = true, features = ["serde", "v4"] }
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
sentry.workspace = true
sentry-tracing.workspace = true
brdgme_cmd = { path = "../lib/cmd", default-features = false }
brdgme_color = { path = "../lib/color" }
brdgme_game = { path = "../lib/game" }
brdgme_game_client = { path = "../lib/game_client", features = ["sentry"] }
brdgme_markup = { path = "../lib/markup" }
minijinja = "2"
serde_yaml_ng.workspace = true
async-nats.workspace = true
futures-util.workspace = true
axum.workspace = true
aes-gcm.workspace = true
thiserror.workspace = true
hex.workspace = true

[dev-dependencies]
sqlx = { workspace = true, features = ["macros", "migrate"] }

[lints]
workspace = true
