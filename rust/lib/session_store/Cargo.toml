[package]
name = "brdgme_session_store"
version.workspace = true
edition.workspace = true
publish = false
authors.workspace = true

[dependencies]
async-trait = "0.1"
rmp-serde = "1.1.2"
sqlx = { workspace = true, features = ["time"] }
thiserror = { workspace = true }
time = { workspace = true }
tower-sessions = "0.14"

[dev-dependencies]
# Adds the test/migrate machinery for #[sqlx::test]; feature-unified with the
# main sqlx dependency when building tests.
sqlx = { workspace = true, features = ["macros", "migrate"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
