[package]
name = "brdgme_cmd"
version.workspace = true
edition.workspace = true
publish.workspace = true
authors.workspace = true

[dependencies]
brdgme_color = { path = "../color" }
brdgme_game = { path = "../game" }
brdgme_markup = { path = "../markup" }
time = { workspace = true, features = ["parsing", "formatting", "macros"] }
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
terminal_size = "0.4"
warp = { version = "0.4.3", features = ["server"], optional = true }
tokio = { workspace = true, features = ["signal"], optional = true }
sentry = { workspace = true, optional = true }
env_logger = "0.11.11"
rand.workspace = true

[features]
default = ["http-server"]
http-server = ["warp", "tokio", "sentry"]
test-support = []

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
warp = { version = "0.4.3", features = ["server", "test"] }

[lints]
workspace = true
