[package]
name = "brdgme_cmd"
version.workspace = true
edition.workspace = true
publish.workspace = true
authors.workspace = true

[dependencies]
brdgme_color = { path = "../color" }
brdgme_game = { path = "../game" }
brdgme_markup = { path = "../markup" }
time = { workspace = true, features = ["parsing", "formatting", "macros"] }
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
terminal_size = "0.4"
axum = { workspace = true, optional = true }
tokio = { workspace = true, features = ["signal", "net", "rt"], optional = true }
sentry = { workspace = true, optional = true }
env_logger = "0.11.11"
rand.workspace = true

[features]
default = ["http-server"]
http-server = ["axum", "tokio", "sentry"]
test-support = []

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
