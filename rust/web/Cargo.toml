[package]
name = "web"
version.workspace = true
edition.workspace = true
publish.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# #34 dev-only import CLI (spec D5): never deployed; requires ssr because it
# links the server-side db/game modules.
[[bin]]
name = "import-game"
path = "src/bin/import_game.rs"
required-features = ["ssr"]

[dependencies]
leptos = { version = "0.8.20" }
leptos_router = { version = "0.8.15" }
axum = { workspace = true, optional = true, features = ["macros"] }
console_error_panic_hook = { version = "0.1", optional = true }
leptos_axum = { version = "0.8.10", optional = true }
leptos_meta = { version = "0.8.6" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal"], optional = true }
tokio-util = { version = "0.7", optional = true }
wasm-bindgen = { version = "=0.2.121", optional = true }

# Database dependencies
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "migrate"], optional = true }
uuid = { workspace = true, features = ["serde", "v4", "js"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
time = { workspace = true, features = ["formatting", "parsing"] }
serde.workspace = true
serde_json.workspace = true

# Additional server dependencies
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, features = ["json", "env-filter"], optional = true }
tower = { version = "0.5", features = ["util"], optional = true }
tower-sessions = { version = "0.14.0", optional = true }
tower-sessions-sqlx-store = { version = "0.15.0", features = ["postgres"], optional = true }
tower-http = { version = "0.7", features = ["cors", "trace", "limit", "timeout"], optional = true }
anyhow = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }

# Email functionality
resend-rs = { version = "0.28", default-features = false, features = ["rustls-tls"], optional = true }
# MJML -> email-safe HTML compiler for the #22b email render. SSR-only: never
# in the WASM bundle (gated under the `ssr` feature, NOT `hydrate`).
mrml = { version = "6.0.1", optional = true }
svix = { version = "1.99", optional = true }
mail-parser = { version = "0.11", optional = true }
async-trait = { version = "0.1", optional = true }

# Default-username generation (D3) - server-only
petname = { version = "=3.1.0", default-features = false, features = ["default-words", "default-rng"], optional = true }

# Markdown -> HTML for the rules/strategy render (#25). SSR-only: never in the
# WASM bundle (gated under the `ssr` feature, NOT `hydrate`).
pulldown-cmark = { version = "0.13.4", optional = true }

# Environment variables
dotenvy = { version = "0.15", optional = true }

# Game engine dependencies from existing API
brdgme_cmd = { path = "../lib/cmd", default-features = false, optional = true }
brdgme_game = { path = "../lib/game", optional = true }
brdgme_color = { path = "../lib/color", optional = true }
brdgme_markup = { path = "../lib/markup", optional = true }
brdgme_game_client = { path = "../lib/game_client", optional = true, features = ["sentry"] }
reqwest = { workspace = true, features = ["json", "form", "rustls"], optional = true }
# The workspace enables both rustls backends (reqwest -> aws-lc-rs;
# sqlx/async-nats defaults -> ring), so rustls can't auto-select a
# process-default provider. Direct dep exists solely for the
# install_default() call in main.rs; see CODING.md's rustls section.
rustls = { workspace = true, optional = true }
aes-gcm = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
zeroize = { version = "1", optional = true }
rand.workspace = true
futures-util.workspace = true
gloo-net = { version = "0.7", features = ["websocket"] }
gloo-timers = { version = "0.4", features = ["futures"] }
web-sys = { version = "0.3.77", features = ["Location", "Window", "Document", "HtmlDocument", "Element", "MediaQueryList", "VisibilityState", "MessageEvent"] }
js-sys = "0.3"
async-nats = { workspace = true, optional = true }
tokio-stream = { version = "0.1", features = ["sync"], optional = true }
leptos-use = { version = "0.19", default-features = false, features = ["use_event_source", "use_event_listener", "use_document"] }
codee = { version = "0.3.5", default-features = false }
axum-prometheus = { version = "0.10.0", default-features = false, features = ["prometheus"], optional = true }

# Error tracking (Sentry). Default features (reqwest + native-tls transport) -
# no rustls involvement, see CODING.md's rustls crypto-provider section.
sentry = { workspace = true, optional = true }
sentry-tower = { version = "0.48", optional = true, features = ["http"] }
sentry-tracing = { workspace = true, optional = true }

[features]
hydrate = [
    "leptos/hydrate",
    "dep:console_error_panic_hook",
    "dep:wasm-bindgen",
    "dep:brdgme_cmd",
    "dep:brdgme_game",
    "dep:brdgme_color",
    "dep:brdgme_markup",
]
ssr = [
    "dep:axum",
    "dep:tokio",
    "dep:tokio-util",
    "dep:leptos_axum",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "dep:sqlx",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:tower",
    "dep:tower-sessions",
    "dep:tower-sessions-sqlx-store",
    "dep:anyhow",
    "dep:thiserror",
    "dep:resend-rs",
    "dep:mrml",
    "dep:svix",
    "dep:mail-parser",
    "dep:async-trait",
    "dep:petname",
    "dep:pulldown-cmark",
    "dep:brdgme_cmd",
    "dep:brdgme_game",
    "dep:brdgme_game_client",
    "dep:brdgme_color",
    "dep:brdgme_markup",
    "dep:dotenvy",
    "dep:tower-http",
    "dep:reqwest",
    "dep:rustls",
    "dep:aes-gcm",
    "dep:hex",
    "dep:zeroize",
    "dep:async-nats",
    "dep:tokio-stream",
    "leptos-use/ssr",
    "dep:axum-prometheus",

    # Error tracking (Sentry)
    "dep:sentry",
    "dep:sentry-tower",
    "dep:sentry-tracing",
]

# Defines a size-optimized profile for the WASM bundle in release mode
[profile.wasm-release]
inherits = "release"
opt-level = 'z'
lto = true
codegen-units = 1
panic = "abort"

[dev-dependencies]
bytes = "1"
http-body-util = "0.1"
reqwest = { workspace = true, features = ["stream", "rustls"] }
serial_test = "3.5.0"
tokio = { workspace = true, features = ["test-util", "rt-multi-thread", "macros", "signal"] }


[package.metadata.leptos]
output-name = "web"
bin-target = "web"
site-root = "target/site"
site-pkg-dir = "pkg"
# Content-hash pkg/ asset filenames (web.<hash>.wasm/js/css) so Cloudflare
# edge caching can't serve stale JS glue against a new wasm after a deploy.
# The server must run with LEPTOS_HASH_FILES=true (set in rust/Dockerfile)
# for HydrationScripts to actually read hash.txt and emit hashed URLs.
hash-files = true
style-file = "style/main.scss"
# Assets source dir; copied/synced to site-root.
assets-dir = "public"
site-addr = "127.0.0.1:3000"
reload-port = 3001
end2end-cmd = "npx playwright test"
end2end-dir = "end2end"
browserquery = "defaults"
env = "DEV"
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"
wasm-opt-features = ["-Oz", "--enable-bulk-memory", "--enable-nontrapping-float-to-int", "-g"]

[lints]
workspace = true
