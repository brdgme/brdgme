[workspace]
members = [
    "bot",
    "game/acquire-1",
    "game/age-of-war-2",
    "game/alhambra-1",
    "game/battleship-2",
    "game/category-5-2",
    "game/cathedral-2",
    "game/farkle-2",
    "game/for-sale-2",
    "game/greed-2",
    "game/hanamikoji-1",
    "game/jaipur-2",
    "game/liars-dice-2",
    "game/lords-of-vegas-1",
    "game/lost-cities-1",
    "game/lost-cities-2",
    "game/love-letter-2",
    "game/modern-art-2",
    "game/no-thanks-2",
    "game/red7-1",
    "game/roll-through-the-ages-2",
    "game/seven-wonders-1",
    "game/splendor-2",
    "game/starship-catan-1",
    "game/sushi-go-2",
    "game/sushizock-2",
    "game/texas-holdem-2",
    "game/tic-tac-toe-2",
    "game/zombie-dice-2",
    "lib/cmd",
    "lib/color",
    "lib/cost",
    "lib/game",
    "lib/game_bin",
    "lib/game_client",
    "lib/markup",
    "lib/rand_bot",
    "lib/session_store",
    "operator",
    "tools/fuzz",
    "tools/render_plain",
    "tools/repl",
    "web",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
authors = ["Michael Alexander"]

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1" }
rand = "0.10.2"
serde_json = "1.0.151"
thiserror = "2.0.19"
tracing = "0.1"
time = { version = "0.3", features = ["serde"] }
tracing-subscriber = "0.3"
sentry = { version = "0.48", default-features = false, features = ["backtrace", "contexts", "debug-images", "panic", "release-health", "reqwest", "native-tls"] }
sentry-tracing = "0.48"
reqwest = { version = "0.13", default-features = false }
axum = "0.8.9"
anyhow = "1.0.104"
uuid = "1.24.0"
serde_yaml_ng = "0.10.0"
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
hex = "0.4"
futures-util = "0.3.33"
async-nats = "0.49.1"
aes-gcm = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
debug = "line-tables-only"

[profile.wasm-dev]
opt-level = 1
inherits = "dev"

[profile.wasm-release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
inherits = "release"
debug = true
