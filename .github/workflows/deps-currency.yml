name: deps-currency

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  cargo-deny-advisories:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check advisories
